document.querySelector('#unlock').addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#pin'),status=document.querySelector('#status'),button=document.querySelector('#submit');button.disabled=true;status.textContent='Dossier wird entschlüsselt …';try{if(!globalThis.crypto?.subtle)throw Error('context');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.data));guideURL=URL.createObjectURL(new Blob([bytes],{type:'text/html;charset=utf-8'}));document.querySelector('#guide').src=guideURL;document.querySelector('#gate').style.display='none';document.querySelector('#reader').style.display='block';input.value='';status.textContent='';}catch(error){status.textContent=error.message==='context'?'Bitte über HTTPS oder als lokale HTML-Datei in einem aktuellen Browser öffnen.':'PIN stimmt nicht oder die Datei ist beschädigt.';}finally{button.disabled=false;}});
